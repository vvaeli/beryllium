version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - gen/
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
