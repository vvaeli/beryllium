name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod buf format --diff --exit-code
      - run: go tool -modfile=tools/go.mod buf lint
      - name: Generated code is up to date
        run: |
          go tool -modfile=tools/go.mod buf generate
          git diff --exit-code gen/
      # Informational until the v1 API is frozen (ROADMAP 15.5).
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/main"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cache cores
        uses: actions/cache@v4
        with:
          path: cores/bin
          key: cores-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cores/versions.json') }}
      # Core-dependent tests (config checks, end-to-end chains) skip without these.
      - run: go -C tools run ./fetchcores
      - run: go build ./...
      - run: go test -race ./...
