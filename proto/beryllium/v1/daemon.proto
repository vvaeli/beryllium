syntax = "proto3";

package beryllium.v1;

import "beryllium/v1/common.proto";
import "google/protobuf/duration.proto";

service DaemonService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // Debugging: runs the watchdog's handling of an event without the event
  // happening (ROADMAP 7.17). Returns once the event was handled.
  rpc SimulateEvent(SimulateEventRequest) returns (SimulateEventResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string commit = 2;
  string build_date = 3;
  string os = 4;
  string arch = 5;
  repeated CoreInfo cores = 6;
}

message CoreInfo {
  CoreKind kind = 1;
  string version = 2;
  bool installed = 3;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  google.protobuf.Duration uptime = 2;
}

message ShutdownRequest {}

message ShutdownResponse {}

enum SimulatedEvent {
  SIMULATED_EVENT_UNSPECIFIED = 0;
  // The machine is about to sleep: connections are closed.
  SIMULATED_EVENT_SLEEP = 1;
  // The machine woke up: wait for the network, reset, check, recover.
  SIMULATED_EVENT_WAKE = 2;
  SIMULATED_EVENT_NETWORK_CHANGE = 3;
  // A periodic health check, now.
  SIMULATED_EVENT_HEALTH_CHECK = 4;
}

message SimulateEventRequest {
  SimulatedEvent event = 1;
}

message SimulateEventResponse {}
