syntax = "proto3";

package beryllium.v1;

import "beryllium/v1/common.proto";
import "google/protobuf/duration.proto";

service TestService {
  // Measures latency to servers; results stream as they complete.
  rpc PingServers(PingServersRequest) returns (stream PingServersResponse);
  // Checks connectivity through the active tunnel.
  rpc UrlTest(UrlTestRequest) returns (UrlTestResponse);
}

// How server latency is measured.
enum PingMethod {
  PING_METHOD_UNSPECIFIED = 0;
  // HTTP GET to a test URL through the server (the full proxy chain).
  // UNSPECIFIED means HTTP.
  PING_METHOD_HTTP = 1;
  // TCP handshake to the server's address:port, without the proxy.
  // Not applicable to UDP-based protocols (Hysteria2, TUIC, WireGuard).
  PING_METHOD_TCP = 2;
  // ICMP echo to the server's host.
  PING_METHOD_ICMP = 3;
}

message PingServersRequest {
  // Servers to ping. Empty means all servers of subscription_id, or all
  // servers if that is empty too.
  repeated string server_ids = 1;
  PingMethod method = 2;
  // Test URL for HTTP; empty uses http://www.gstatic.com/generate_204.
  string url = 3;
  // Per-server timeout; default 5s.
  google.protobuf.Duration timeout = 4;
  string subscription_id = 5;
}

message PingServersResponse {
  string server_id = 1;
  google.protobuf.Duration latency = 2;
  // Set when the server is unreachable.
  ErrorDetail error = 3;
}

message UrlTestRequest {
  // Empty uses the built-in generate_204 endpoints.
  string url = 1;
}

message UrlTestResponse {
  bool ok = 1;
  google.protobuf.Duration latency = 2;
  ErrorDetail error = 3;
}
